<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Live Session</title>
<!--SERVER_INJECTED_CONFIG-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050507; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

  #room-container { display: flex; flex-direction: column; height: 100%; }

  #video-grid {
    flex: 1;
    display: grid;
    gap: 4px;
    padding: 4px;
    grid-template-columns: 1fr;
    overflow: hidden;
  }
  #video-grid.two-participants { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  #video-grid.multi-participants { grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; }

  .participant-tile {
    position: relative;
    background: #1a1a1f;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .participant-tile video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .participant-name {
    position: absolute;
    bottom: 8px;
    left: 8px;
    background: rgba(0,0,0,0.6);
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 12px;
    color: #fff;
  }
  .participant-avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #C9933A;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    color: #fff;
  }
  .muted-icon {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.6);
    border-radius: 50%;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  #controls {
    display: flex;
    justify-content: center;
    gap: 16px;
    padding: 12px 16px;
    background: #111114;
  }
  .ctrl-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: #2a2a30;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .ctrl-btn:hover { background: #3a3a40; }
  .ctrl-btn.active { background: #C9933A; }
  .ctrl-btn.end-call { background: #e53935; }
  .ctrl-btn.end-call:hover { background: #c62828; }
  .ctrl-btn.off { background: #555; }
  .ctrl-btn.screen-share { background: #2a2a30; }
  .ctrl-btn.screen-share.active { background: #4CAF50; }
  .ctrl-btn.hidden { display: none; }

  .screen-share-tile {
    grid-column: 1 / -1;
    min-height: 300px;
  }
  .screen-share-tile video {
    object-fit: contain !important;
  }

  #status-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #050507;
    z-index: 10;
  }
  #status-overlay.hidden { display: none; }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #333;
    border-top-color: #C9933A;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status-text { color: #aaa; font-size: 14px; }
</style>
</head>
<body>
<div id="room-container">
  <div id="status-overlay">
    <div class="spinner"></div>
    <div id="status-text">Step 1: Loading LiveKit library...</div>
    <div id="debug-log" style="margin-top:16px;font-size:11px;color:#666;max-width:90%;text-align:left;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto;"></div>
  </div>
  <div id="video-grid"></div>
  <div id="controls">
    <button class="ctrl-btn active" id="btn-mic" title="Toggle Microphone">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <button class="ctrl-btn off" id="btn-camera" title="Toggle Camera">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 7l-7 5 7 5V7z"/>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
    </button>
    <button class="ctrl-btn screen-share hidden" id="btn-screen" title="Share Screen">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
    </button>
    <button class="ctrl-btn end-call" id="btn-leave" title="Leave">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
    </button>
  </div>
</div>

<script type="module">
const debugLog = document.getElementById('debug-log');
const statusText = document.getElementById('status-text');
function dbg(msg) {
  const ts = new Date().toISOString().substr(11, 12);
  debugLog.textContent += ts + ' ' + msg + '\n';
  debugLog.scrollTop = debugLog.scrollHeight;
  console.log('[livekit-debug]', msg);
}

dbg('Module script started');
dbg('Config: ' + JSON.stringify(window.__LIVEKIT_CONFIG__ ? {wsUrl: window.__LIVEKIT_CONFIG__.wsUrl, hasToken: !!window.__LIVEKIT_CONFIG__.token, displayName: window.__LIVEKIT_CONFIG__.displayName} : 'MISSING'));

let Room, RoomEvent, Track, VideoPresets, createLocalTracks;
try {
  statusText.textContent = 'Step 1: Loading LiveKit library...';
  dbg('Fetching livekit-client from local server...');
  const lk = await import('/api/streams/livekit-client.esm.mjs');
  Room = lk.Room;
  RoomEvent = lk.RoomEvent;
  Track = lk.Track;
  VideoPresets = lk.VideoPresets;
  createLocalTracks = lk.createLocalTracks;
  dbg('LiveKit library loaded successfully');
  statusText.textContent = 'Step 2: Library loaded. Creating room...';
} catch (err) {
  dbg('FATAL: Failed to load LiveKit library: ' + err.message);
  statusText.textContent = 'ERROR loading LiveKit library: ' + err.message;
  throw err;
}

const config = window.__LIVEKIT_CONFIG__ || {};
const wsUrl = config.wsUrl;
const token = config.token;
const displayName = config.displayName || 'Guest';

const grid = document.getElementById('video-grid');
const overlay = document.getElementById('status-overlay');
const btnMic = document.getElementById('btn-mic');
const btnCamera = document.getElementById('btn-camera');
const btnScreen = document.getElementById('btn-screen');
const btnLeave = document.getElementById('btn-leave');

const canShare = config.canShare === true;
if (canShare && typeof navigator.mediaDevices?.getDisplayMedia === 'function') {
  btnScreen.classList.remove('hidden');
}

let room;
let micEnabled = true;
let camEnabled = false;
let screenShareTrack = null;

function postToApp(msg) {
  if (window.ReactNativeWebView) {
    window.ReactNativeWebView.postMessage(JSON.stringify(msg));
  }
  if (window.parent !== window) {
    window.parent.postMessage(JSON.stringify(msg), '*');
  }
}

function updateGridLayout() {
  const tiles = grid.querySelectorAll('.participant-tile');
  const count = tiles.length;
  grid.className = '';
  if (count === 2) grid.classList.add('two-participants');
  else if (count > 2) grid.classList.add('multi-participants');
}

function getOrCreateTile(identity, name) {
  let tile = document.getElementById('tile-' + identity);
  if (!tile) {
    tile = document.createElement('div');
    tile.id = 'tile-' + identity;
    tile.className = 'participant-tile';

    const avatar = document.createElement('div');
    avatar.className = 'participant-avatar';
    avatar.textContent = (name || '?')[0].toUpperCase();
    avatar.id = 'avatar-' + identity;
    tile.appendChild(avatar);

    const label = document.createElement('div');
    label.className = 'participant-name';
    label.textContent = name || identity;
    tile.appendChild(label);

    grid.appendChild(tile);
    updateGridLayout();
  }
  return tile;
}

function removeTile(identity) {
  const tile = document.getElementById('tile-' + identity);
  if (tile) { tile.remove(); updateGridLayout(); }
}

function getOrCreateScreenTile(identity, name) {
  const tileId = 'screen-tile-' + identity;
  let tile = document.getElementById(tileId);
  if (!tile) {
    tile = document.createElement('div');
    tile.id = tileId;
    tile.className = 'participant-tile screen-share-tile';
    const label = document.createElement('div');
    label.className = 'participant-name';
    label.textContent = (name || identity) + "'s screen";
    tile.appendChild(label);
    grid.insertBefore(tile, grid.firstChild);
    updateGridLayout();
  }
  return tile;
}

function removeScreenTile(identity) {
  const tile = document.getElementById('screen-tile-' + identity);
  if (tile) { tile.remove(); updateGridLayout(); }
}

function attachTrack(track, identity, name) {
  if (track.source === 'screen_share') {
    const tile = getOrCreateScreenTile(identity, name);
    const existing = tile.querySelector('video');
    if (existing) { existing.srcObject = null; existing.remove(); }
    const el = track.attach();
    el.style.width = '100%';
    el.style.height = '100%';
    el.style.objectFit = 'contain';
    tile.insertBefore(el, tile.firstChild);
    return;
  }

  const tile = getOrCreateTile(identity, name);
  const avatar = document.getElementById('avatar-' + identity);
  const isLocal = room && room.localParticipant && identity === room.localParticipant.identity;

  if (isLocal && track.kind === 'audio') return;

  if (track.kind === 'video') {
    const existing = tile.querySelector('video');
    if (existing) { existing.srcObject = null; existing.remove(); }
    const el = track.attach();
    el.style.width = '100%';
    el.style.height = '100%';
    el.style.objectFit = 'cover';
    el.muted = isLocal;
    el.volume = isLocal ? 0 : 1;
    tile.insertBefore(el, tile.firstChild);
    if (avatar) avatar.style.display = 'none';
  } else if (track.kind === 'audio') {
    const existing = tile.querySelectorAll('audio');
    existing.forEach(a => { a.srcObject = null; a.remove(); });
    const el = track.attach();
    el.style.display = 'none';
    tile.appendChild(el);
  }
}

function detachTrack(track, identity) {
  if (track.source === 'screen_share') {
    track.detach().forEach(el => el.remove());
    removeScreenTile(identity);
    return;
  }
  track.detach().forEach(el => el.remove());
  const tile = document.getElementById('tile-' + identity);
  const avatar = document.getElementById('avatar-' + identity);
  if (tile && !tile.querySelector('video') && avatar) {
    avatar.style.display = 'flex';
  }
}

async function connect() {
  if (!wsUrl || !token) {
    dbg('FATAL: Missing wsUrl=' + !!wsUrl + ' token=' + !!token);
    statusText.textContent = 'ERROR: Missing connection parameters (wsUrl=' + !!wsUrl + ', token=' + !!token + ')';
    return;
  }

  dbg('Creating Room object...');
  try {
    room = new Room({
      adaptiveStream: true,
      dynacast: true,
      videoCaptureDefaults: { resolution: VideoPresets.h540.resolution },
      audioCaptureDefaults: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
        channelCount: 1,
      },
      publishDefaults: {
        dtx: true,
        red: true,
      },
    });
    dbg('Room object created successfully');
    statusText.textContent = 'Step 3: Room created. Connecting to server...';
  } catch (err) {
    dbg('FATAL: Room creation failed: ' + err.message);
    statusText.textContent = 'ERROR creating room: ' + err.message;
    return;
  }

  room.on(RoomEvent.Connected, () => {
    dbg('EVENT: RoomEvent.Connected fired');
    overlay.classList.add('hidden');
    postToApp({ type: 'connected' });
  });

  room.on(RoomEvent.Disconnected, (reason) => {
    dbg('EVENT: RoomEvent.Disconnected reason=' + reason);
    overlay.classList.remove('hidden');
    statusText.textContent = 'Disconnected: ' + (reason || 'unknown');
    postToApp({ type: 'call_ended', reason: reason });
  });

  room.on(RoomEvent.TrackSubscribed, (track, pub, participant) => {
    if (room.localParticipant && participant.identity === room.localParticipant.identity) return;
    attachTrack(track, participant.identity, participant.name);
  });

  room.on(RoomEvent.TrackUnsubscribed, (track, pub, participant) => {
    detachTrack(track, participant.identity);
  });

  room.on(RoomEvent.LocalTrackPublished, (pub) => {
    if (pub.track) {
      attachTrack(pub.track, room.localParticipant.identity, room.localParticipant.name);
    }
  });

  room.on(RoomEvent.LocalTrackUnpublished, (pub) => {
    if (pub.track) {
      detachTrack(pub.track, room.localParticipant.identity);
    }
  });

  room.on(RoomEvent.ParticipantConnected, (participant) => {
    getOrCreateTile(participant.identity, participant.name);
    postToApp({ type: 'participant_joined', name: participant.name });
  });

  room.on(RoomEvent.ParticipantDisconnected, (participant) => {
    removeTile(participant.identity);
    postToApp({ type: 'participant_left', name: participant.name });
  });

  room.on(RoomEvent.TrackMuted, (pub, participant) => {
    if (pub.kind === 'video') {
      const avatar = document.getElementById('avatar-' + participant.identity);
      const tile = document.getElementById('tile-' + participant.identity);
      if (tile) {
        const vid = tile.querySelector('video');
        if (vid) vid.style.display = 'none';
      }
      if (avatar) avatar.style.display = 'flex';
    }
  });

  room.on(RoomEvent.TrackUnmuted, (pub, participant) => {
    if (pub.kind === 'video') {
      const avatar = document.getElementById('avatar-' + participant.identity);
      const tile = document.getElementById('tile-' + participant.identity);
      if (tile) {
        const vid = tile.querySelector('video');
        if (vid) vid.style.display = '';
      }
      if (avatar) avatar.style.display = 'none';
    }
  });

  dbg('Starting connection to ' + wsUrl);
  statusText.textContent = 'Step 3: Connecting to ' + wsUrl + '...';

  const connectTimeout = setTimeout(() => {
    dbg('TIMEOUT: 15s elapsed, connection did not complete');
    statusText.textContent = 'Connection timed out after 15s — retrying...';
    postToApp({ type: 'error', message: 'Connection timed out' });
    if (room) {
      room.disconnect().catch(() => {});
    }
    setTimeout(() => connect(), 2000);
  }, 15000);

  room.on(RoomEvent.SignalConnected, () => {
    dbg('EVENT: SignalConnected');
    statusText.textContent = 'Step 4: Signal connected, joining room as ' + displayName + '...';
  });

  try {
    dbg('Calling room.connect()...');
    await room.connect(wsUrl, token);
    clearTimeout(connectTimeout);
    dbg('room.connect() resolved successfully');
    dbg('Local participant: ' + room.localParticipant.identity + ' / ' + room.localParticipant.name);

    getOrCreateTile(room.localParticipant.identity, room.localParticipant.name);

    try {
      dbg('Enabling microphone...');
      await room.localParticipant.setMicrophoneEnabled(true);
      micEnabled = true;
      btnMic.classList.add('active');
      btnMic.classList.remove('off');
      dbg('Microphone enabled');
    } catch (micErr) {
      dbg('Microphone denied: ' + micErr.message);
      micEnabled = false;
      btnMic.classList.remove('active');
      btnMic.classList.add('off');
    }

    room.remoteParticipants.forEach((p) => {
      dbg('Remote participant: ' + p.identity);
      getOrCreateTile(p.identity, p.name);
      p.trackPublications.forEach((pub) => {
        if (pub.track && pub.isSubscribed) {
          attachTrack(pub.track, p.identity, p.name);
        }
      });
    });
  } catch (err) {
    clearTimeout(connectTimeout);
    dbg('CONNECT ERROR: ' + (err.message || String(err)));
    dbg('Error stack: ' + (err.stack || 'none'));
    statusText.textContent = 'Connection failed: ' + (err.message || String(err));
    postToApp({ type: 'error', message: err.message || String(err) });
  }
}

btnMic.addEventListener('click', async () => {
  if (!room) return;
  try {
    micEnabled = !micEnabled;
    await room.localParticipant.setMicrophoneEnabled(micEnabled);
    btnMic.classList.toggle('active', micEnabled);
    btnMic.classList.toggle('off', !micEnabled);
  } catch (err) {
    micEnabled = !micEnabled;
    console.error('Mic toggle failed:', err);
    statusText.textContent = 'Microphone access denied';
    overlay.classList.remove('hidden');
    setTimeout(() => { overlay.classList.add('hidden'); }, 2000);
  }
});

btnCamera.addEventListener('click', async () => {
  if (!room) return;
  try {
    camEnabled = !camEnabled;
    await room.localParticipant.setCameraEnabled(camEnabled);
    btnCamera.classList.toggle('active', camEnabled);
    btnCamera.classList.toggle('off', !camEnabled);
  } catch (err) {
    camEnabled = !camEnabled;
    console.error('Camera toggle failed:', err);
    statusText.textContent = 'Camera access denied';
    overlay.classList.remove('hidden');
    setTimeout(() => { overlay.classList.add('hidden'); }, 2000);
  }
});

btnScreen.addEventListener('click', async () => {
  if (!room) return;
  try {
    if (screenShareTrack) {
      await room.localParticipant.unpublishTrack(screenShareTrack);
      screenShareTrack.stop();
      removeScreenTile(room.localParticipant.identity);
      screenShareTrack = null;
      btnScreen.classList.remove('active');
      return;
    }
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 15, max: 30 } },
      audio: true,
    });
    const videoTrack = stream.getVideoTracks()[0];
    if (!videoTrack) return;

    videoTrack.addEventListener('ended', async () => {
      if (screenShareTrack) {
        try {
          await room.localParticipant.unpublishTrack(screenShareTrack);
        } catch {}
        removeScreenTile(room.localParticipant.identity);
        screenShareTrack = null;
        btnScreen.classList.remove('active');
      }
    });

    const { LocalVideoTrack } = await import('/api/streams/livekit-client.esm.mjs');
    const lkTrack = new LocalVideoTrack(videoTrack, undefined, false);
    await room.localParticipant.publishTrack(lkTrack, { source: 'screen_share', simulcast: false });
    screenShareTrack = lkTrack;
    btnScreen.classList.add('active');

    const tile = getOrCreateScreenTile(room.localParticipant.identity, room.localParticipant.name);
    const el = lkTrack.attach();
    el.style.width = '100%';
    el.style.height = '100%';
    el.style.objectFit = 'contain';
    el.muted = true;
    tile.insertBefore(el, tile.firstChild);
  } catch (err) {
    if (err.name !== 'NotAllowedError') {
      console.error('Screen share failed:', err);
      statusText.textContent = 'Screen share failed';
      overlay.classList.remove('hidden');
      setTimeout(() => { overlay.classList.add('hidden'); }, 2000);
    }
  }
});

btnLeave.addEventListener('click', async () => {
  if (screenShareTrack) {
    screenShareTrack.stop();
    screenShareTrack = null;
  }
  if (room) {
    await room.disconnect();
  }
  postToApp({ type: 'call_ended', reason: 'user_left' });
});

connect();
</script>
</body>
</html>
